<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EK7YRGGWM7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Report the address without its query string, which can carry a GitHub token
      gtag('config', 'G-EK7YRGGWM7', { page_location: location.origin + location.pathname });
    </script>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GH Fitness" />
    <meta name="description" content="Track weight training workouts with AI-generated plans. Offline-first PWA." />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>GitHub Fitness</title>
    <!-- SPA redirect handler for GitHub Pages -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          var data = JSON.parse(redirect);
          var url = '/github-fitness' + data.path + (data.search || '');
          history.replaceState(null, '', url);
        }
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
